<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote desktop · Zireael-RMM</title><link rel="icon" href="/assets/swallow.png"><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/app.css"><script src="/assets/desktop-viewer.js" defer></script><script src="/assets/desktop-page.js" defer></script></head><body class="desktop-page"><header><a class="brand" href="/admin"><img src="/assets/swallow.png" width="36" height="36" alt=""> Zireael-RMM</a><strong id="device-name">Remote desktop</strong><a class="text-link" href="/admin">Console</a></header><main>    <section id="panel-desktop" class="desktop-viewer">
      <div class="toolbar"><button id="desktop-connect">Connect desktop</button><button id="desktop-disconnect" class="quiet">Disconnect</button><button id="desktop-fullscreen" class="quiet">Fullscreen</button><button id="desktop-fit" class="quiet">Actual size</button></div>
      <div class="toolbar"><label>Windows session<select id="desktop-session"><option value="0">Automatic</option></select></label><button id="desktop-start" class="quiet">Start session</button><label>Monitor<select id="desktop-monitor"><option value="1">Default</option></select></label><label>Quality<select id="desktop-quality"><option value="balanced">Balanced</option><option value="sharp">Sharp text</option><option value="fast">Low bandwidth</option></select></label><label>Capture<select id="desktop-backend"><option value="auto">Automatic</option><option value="gdi">GDI</option></select></label><label class="check-label"><input id="desktop-view-only" type="checkbox"> View only</label><label id="desktop-privilege" class="check-label" hidden><input id="desktop-elevated" type="checkbox"> Elevated control</label></div>
      <p id="desktop-status" role="status">Click Connect desktop to begin.</p><div class="desktop-meta"><span id="desktop-backend-label"></span><span id="desktop-expiry"></span></div>
      <div id="desktop-scroll"><canvas id="desktop-canvas" tabindex="0" width="960" height="540" aria-label="Remote desktop"></canvas></div>
      <details><summary>Type text</summary><div class="toolbar"><label>Text<input id="desktop-text" maxlength="512" autocomplete="off"></label><button id="desktop-send-text" class="quiet">Send text</button></div></details>
    </section>
</main></body></html>
