# Shared container hardening and storage. Use start.sh or compose.yaml to run.
services:
  rmm:
    build: .
    restart: unless-stopped
    volumes:
      - rmm-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  rmm-data:
